[tool.poetry]
package-mode = false

[project]
name = "openai-agent-sdk-practice"
version = "0.1.0"
description = "Basic AI agent using OpenAI Agents SDK with Ollama"
authors = [
    {name = "Felipe Triana",email = "trianagomezfelipe@gmail.com"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "openai-agents (>=0.12.5,<0.13.0)",
    "openai (>=2.29.0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pymupdf (>=1.27.2.2,<2.0.0.0)",
    "chromadb (>=1.5.5,<2.0.0)",
    "sentence-transformers (>=5.3.0,<6.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
